name: Build and Save AAR Files

on:
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  build-and-save-aars:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Build project and download dependencies
        run: ./gradlew assembleDebug  # 执行构建命令，会下载所需的AAR文件
        
      - name: Locate downloaded AAR files
        run: |
          # 查找所有下载的AAR文件并记录位置
          find ~/.gradle -name "*.aar" > aar_files.txt
          echo "Found AAR files:"
          cat aar_files.txt
          
      - name: Create AAR archive
        run: |
          # 创建一个目录存放AAR文件
          mkdir -p collected_aars
          
          # 复制找到的AAR文件到收集目录
          while read -r aar_path; do
            cp "$aar_path" collected_aars/
          done < aar_files.txt
          
          # 压缩AAR文件便于下载
          zip -r aar_files.zip collected_aars/
          
      - name: Upload AAR files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-aar-files
          path: aar_files.zip
          retention-days: 30  # 保存30天
